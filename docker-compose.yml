services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build:
      context: ./api
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/bookchart
    depends_on:
      mongo:
        condition: service_healthy

  api-test:
    profiles:
      - test
    build:
      context: ./api
      target: test
    environment:
      NODE_ENV: test
      JWT_SECRET_KEY: test-only-secret

  api-prod:
    profiles:
      - production
    build:
      context: ./api
      target: production
    env_file:
      - ./api/.env
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/bookchart
      CORS_ORIGIN: http://localhost:5174
    depends_on:
      mongo:
        condition: service_healthy

  frontend-prod:
    profiles:
      - production
    build:
      context: ./frontend
      target: production
      args:
        VITE_API_URL: http://localhost:3002/api
    ports:
      - "5174:80"
    depends_on:
      api-prod:
        condition: service_started

  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
  frontend_node_modules:
  api_node_modules:
