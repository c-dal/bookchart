services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    build: ./api
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/monapp
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:8
    command: ["mongod", "--quiet"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo_data:
  frontend_node_modules:
  api_node_modules:
